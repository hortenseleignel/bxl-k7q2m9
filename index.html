<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Maman, je t'emmène à Bruxelles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&display=swap">
<style>
/* Concept : une carte A4 posée sur un plan vert sombre, qui se retourne en 3D sous le doigt. Tout le reste s'efface devant elle. */
:root {
  --ground: #10241c;
  --ground-lit: #1f4436;
  --paper: #f1e4c6;
  --ink-soft: rgba(241, 228, 198, 0.72);
  --accent: #e8944a;
  --serif: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
}

html, body { height: 100%; }

body {
  background-color: var(--ground);
  background-image: radial-gradient(ellipse 80% 70% at 50% 40%, var(--ground-lit), var(--ground) 72%);
  color: var(--paper);
  font-family: var(--serif);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.09;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.stage {
  box-sizing: border-box;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding-block: 14px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.scene {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: grid;
  place-items: center;
  container-type: size;
  perspective: 1800px;
}

.rig {
  --cx: 1;
  --lift: 0;
  position: relative;
  width: min(100cqw, calc(100cqh * 1240 / 1748));
  aspect-ratio: 1240 / 1748;
  max-width: 100%;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  outline: none;
  animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.rig:active { cursor: grabbing; }
.rig:focus-visible .card { outline: 2px solid var(--accent); outline-offset: 6px; }

@keyframes rise {
  from { opacity: 0; transform: translateY(18px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}

.drop {
  position: absolute;
  inset: 0;
  border-radius: clamp(4px, 1.4cqw, 10px);
  box-shadow: 0 28px 60px rgba(0, 0, 0, 0.55), 0 8px 18px rgba(0, 0, 0, 0.4);
  transform: translateY(calc(var(--lift) * 14px)) scaleX(var(--cx));
}

.card {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  will-change: transform;
}

.face {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: clamp(4px, 1.4cqw, 10px);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: var(--paper);
}
.face.back { transform: rotateY(180deg); }

.face img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  -webkit-user-drag: none;
  -webkit-touch-callout: none;
}

.face::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: var(--so, 0);
  background-image: linear-gradient(105deg, transparent 38%, rgba(255, 252, 240, 0.65) 50%, transparent 62%);
  background-size: 260% 100%;
  background-position: var(--sx, 50%) 0;
  background-repeat: no-repeat;
}

.foot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-height: 40px;
}
.hint {
  margin: 0;
  font-style: italic;
  font-size: 13px;
  line-height: 1.4;
  letter-spacing: 0.01em;
  color: var(--ink-soft);
  text-align: center;
}
.dots { display: flex; gap: 8px; }
.dots i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-soft);
  opacity: 0.35;
  transition: opacity 0.3s, background 0.3s, transform 0.3s;
}
.dots i.on { opacity: 1; background: var(--accent); transform: scale(1.25); }

.sound {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  right: max(12px, env(safe-area-inset-right, 0px));
  z-index: 5;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 50%;
  border: 1px solid rgba(241, 228, 198, 0.28);
  background: rgba(16, 36, 28, 0.55);
  color: var(--paper);
  cursor: pointer;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.sound:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sound svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sound .waves { transition: opacity 0.2s; }
.sound[aria-pressed="false"] .waves { opacity: 0; }
.sound .slash { opacity: 0; transition: opacity 0.2s; }
.sound[aria-pressed="false"] .slash { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .rig { animation: none; }
}
</style>

<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
</style>
</head>

<script>
(function () {
  var rig = document.getElementById('rig');
  var card = document.getElementById('card');
  var hint = document.getElementById('hint');
  var d0 = document.getElementById('d0');
  var d1 = document.getElementById('d1');
  var soundBtn = document.getElementById('sound');

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var angle = 0, anim = null, dragging = false, interacted = false;
  var startX = 0, startAngle = 0, lastX = 0, lastT = 0, vel = 0, moved = 0, rustled = false;
  var soundOn = true, ac = null, noiseBuf = null;

  /* ---------- rendu ---------- */
  function render() {
    var r = angle * Math.PI / 180;
    var c = Math.cos(r), s = Math.abs(Math.sin(r));
    card.style.transform = 'rotateY(' + angle.toFixed(2) + 'deg) scale(' + (1 + 0.05 * s).toFixed(4) + ')';
    rig.style.setProperty('--cx', Math.max(0.03, Math.abs(c)).toFixed(3));
    rig.style.setProperty('--lift', s.toFixed(3));
    card.style.setProperty('--so', (0.5 * Math.abs(Math.sin(2 * r))).toFixed(3));
    card.style.setProperty('--sx', (50 - 50 * c).toFixed(1) + '%');
  }

  function side() {
    return ((Math.round(angle / 180) % 2) + 2) % 2;
  }

  function updateLabels() {
    var v = side() === 1;
    d0.classList.toggle('on', !v);
    d1.classList.toggle('on', v);
    hint.textContent = v ? 'Touche de nouveau pour revenir au recto' : 'Touche la carte pour la retourner';
    rig.setAttribute('aria-label', 'Invitation, face ' + (v ? 'verso' : 'recto') + '. Touche ou fais glisser pour retourner la carte.');
  }

  function ease(k) { return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }

  function cancel() { if (anim) { cancelAnimationFrame(anim); anim = null; } }

  function settle() {
    updateLabels();
    if (rustled) { pat(); rustled = false; }
  }

  function go(to, dur, cb) {
    cancel();
    if (reduced) { angle = to; render(); settle(); if (cb) cb(); return; }
    var from = angle, t0 = performance.now();
    function step(now) {
      var k = Math.min(1, (now - t0) / dur);
      angle = from + (to - from) * ease(k);
      render();
      if (k < 1) { anim = requestAnimationFrame(step); }
      else { anim = null; settle(); if (cb) cb(); }
    }
    anim = requestAnimationFrame(step);
  }

  function dur(to) { return Math.max(380, 780 * Math.abs(to - angle) / 180); }

  /* ---------- son (synthétisé, aucun fichier) ---------- */
  function ensureAudio() {
    if (!soundOn) return;
    try {
      if (!ac) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        var len = Math.floor(ac.sampleRate * 1.2);
        noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }

  function rustle() {
    if (!soundOn || !ac || !noiseBuf) return;
    try {
      var t = ac.currentTime, total = 0.55, step = 0.018;
      var src = ac.createBufferSource();
      src.buffer = noiseBuf;
      src.playbackRate.value = 0.9 + Math.random() * 0.2;
      var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400;
      var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 4200; bp.Q.value = 0.7;
      var g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      var n = Math.floor(total / step);
      for (var i = 1; i < n; i++) {
        var x = i / n;
        var env = Math.sin(Math.PI * Math.pow(x, 0.7));
        var crackle = Math.random() < 0.35 ? 1 : 0.25 + Math.random() * 0.35;
        g.gain.linearRampToValueAtTime(0.32 * env * crackle, t + i * step);
      }
      g.gain.linearRampToValueAtTime(0, t + total);
      src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(ac.destination);
      src.start(t, Math.random() * 0.5, total + 0.05);
    } catch (e) {}
  }

  function pat() {
    if (!soundOn || !ac || !noiseBuf) return;
    try {
      var t = ac.currentTime;
      var src = ac.createBufferSource();
      src.buffer = noiseBuf;
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
      var g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.28, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      src.connect(lp); lp.connect(g); g.connect(ac.destination);
      src.start(t, Math.random() * 0.5, 0.2);
    } catch (e) {}
  }

  function startRustle() {
    if (rustled) return;
    rustled = true;
    rustle();
  }

  /* ---------- gestes ---------- */
  function flipBy(dir) {
    interacted = true;
    ensureAudio();
    var to = Math.round(angle / 180) * 180 + dir * 180;
    startRustle();
    go(to, dur(to));
  }

  rig.addEventListener('pointerdown', function (e) {
    interacted = true;
    cancel();
    ensureAudio();
    dragging = true;
    moved = 0;
    vel = 0;
    startX = lastX = e.clientX;
    lastT = performance.now();
    startAngle = angle;
    try { rig.setPointerCapture(e.pointerId); } catch (err) {}
  });

  rig.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - startX;
    moved = Math.max(moved, Math.abs(dx));
    if (moved > 8) startRustle();
    var w = rig.clientWidth || 300;
    var a = startAngle + dx / w * 180;
    angle = Math.max(startAngle - 180, Math.min(startAngle + 180, a));
    var now = performance.now(), dt = Math.max(1, now - lastT);
    vel = 0.6 * vel + 0.4 * ((e.clientX - lastX) / dt);
    lastX = e.clientX; lastT = now;
    render();
  });

  function release(cancelled) {
    if (!dragging) return;
    dragging = false;
    var to;
    if (!cancelled && moved < 8) {
      to = Math.round(angle / 180) * 180 + 180;
      startRustle();
    } else if (!cancelled && Math.abs(vel) > 0.45) {
      to = (vel > 0 ? Math.ceil(angle / 180) : Math.floor(angle / 180)) * 180;
    } else {
      to = Math.round(angle / 180) * 180;
    }
    go(to, dur(to));
  }
  rig.addEventListener('pointerup', function () { release(false); });
  rig.addEventListener('pointercancel', function () { release(true); });

  rig.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); flipBy(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); flipBy(-1); }
  });

  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.setAttribute('aria-label', soundOn ? 'Son activé' : 'Son coupé');
    if (soundOn) { ensureAudio(); pat(); }
  });

  /* ---------- petit signe d'invitation, une seule fois ---------- */
  render();
  updateLabels();
  if (!reduced) {
    setTimeout(function () {
      if (interacted) return;
      go(10, 520, function () {
        if (interacted) return;
        go(0, 640);
      });
    }, 1500);
  }
})();
</script>

</body>
</html>
